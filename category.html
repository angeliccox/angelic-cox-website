<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Work | Angelic Cox</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<!-- One page serves every work category: category.html?c=<slug>.
     Add projects to a category in js/site.js. -->
<body data-page="category">
  <header id="site-header"></header>

  <main id="main">
    <h1 class="cat-title"><span data-cat-title>Category</span></h1>

    <div class="masonry" data-projects></div>

    <nav class="cat-nav" aria-label="More work" data-cat-nav></nav>
  </main>

  <footer id="site-footer"></footer>
  <script src="js/site.js"></script>
</body>
</html>
